[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-layer-dynamics-64"
version = "0.7.0"
description = "64 KiB Virtual Layer utility for algebraic navigation and state operations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kier73" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vld = "vld.micro_control:cli_main"

[tool.setuptools.packages.find]
where = ["src"]
