name: Observer closure
on:
  pull_request:
    paths:
      - 'experiments/observer_closure/**'
      - '.github/workflows/observer-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s experiments/observer_closure -v
        env:
          PYTHONPATH: src
