name: VL-64 sparse multi-field observation and navigation

on:
  push:
    branches:
      - main
      - feature/multifield-partial-ground-20261118
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-field:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install -e ".[dev]"
      - name: Test full VL-64 suite, sparse layouts and partial evidence
        run: python -m pytest -q tests/
      - name: Learn interacting byte fields and issue typed observer requests
        run: |
          python -m experiments.byte_fabric.multifield_lab --out artifacts
          python -m experiments.observer_intent.arbitrate \
            --intent artifacts/multifield-navigate-intention.json \
            --out artifacts/navigated-multifield.json
          python -m experiments.observer_intent.arbitrate \
            --intent artifacts/multifield-partial-intention.json \
            --out artifacts/recommended-byte-probe.json
          python -m experiments.observer_intent.arbitrate \
            --intent artifacts/multifield-mixed-word-intention.json \
            --out artifacts/mixed-action-result.json
      - name: Verify Ground, observed dependencies, typed probe and no fabricated transitions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.byte_fabric.multifield_ground import MultiFieldNavigator
          p=Path("artifacts")
          read=lambda name:json.loads((p/name).read_text())
          report=read("multifield-observation-report.json")
          ground=read("learned-multifield-ground.json")
          observed=read("recommended-byte-probe.json")
          distant=read("navigated-multifield.json")
          assert report["status"]=="HELDOUT_MULTI_FIELD_GROUND_VALIDATED"
          assert report["changing_byte_spans"]==[
              {"offset":73,"width":1},{"offset":311,"width":2}]
          assert report["known_transition_edges"]==16
          assert report["verified_heldout_count"]==16
          assert report["unseen_mixed_action_words_checked"]==62
          assert report["witnessed_cross_field_dependency"] is True
          assert report["compression_ratio"]>2
          assert report["missing_edge_status"]=="UNRESOLVED"
          assert report["tampered_byte_status"]=="CONTRADICTED"
          assert observed["status"]=="MULTIPLE_COMPATIBLE_MODEL_STATES"
          assert observed["result"]["known_byte_count"]==1
          assert observed["result"]["next_probe"]["byte_interval"]==[311,313]
          assert distant["status"]=="OBSERVED_GROUND_NAVIGATION"
          assert distant["result"]["result"]["value"]==report["modeled_result_sha256"]
          assert distant["result"]["cycle_skipped_steps"]>10**12-20
          mixed=read("mixed-action-result.json")
          assert mixed["status"]=="OBSERVED_GROUND_NAVIGATION"
          assert mixed["result"]["completed_steps"]==5
          assert len(mixed["result"]["witnessed_edge_receipts"])==5
          assert MultiFieldNavigator(ground).navigate(
              "0000ff","tick",10**12+3,"digest.sha256")[
                  "result"]["value"]==report["modeled_result_sha256"]
          print("VL64_MULTI_FIELD_VERIFIED",json.dumps({
              "ground_digest":ground["ground_digest"],
              "description_bytes":report["description_bytes"],
              "raw_frame_bytes":report["raw_transition_frame_bytes"],
              "ratio":report["compression_ratio"],
              "changed_spans":report["changing_byte_spans"],
              "next_probe":observed["result"]["next_probe"],
              "modeled_horizon":report["modeled_horizon"],
              "cycle_skipped":report["modeled_cycle_skipped_steps"],
          },sort_keys=True))
          PY
      - name: Preserve Ground, partial observation plan and independent challenge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vl64-multifield-python-__PYTHON_VERSION__
          path: artifacts/*
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce 64 KiB source runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          n=sum(p.stat().st_size for p in Path("src/vld").glob("*.py"))
          assert n<=65536,n
          print("VL64_MULTIFIELD_CORE_BYTES",n)
          PY
