name: Test VL-64 observed Ground translation

on:
  push:
    branches: [feature/observed-ground-translation-20261118]

jobs:
  translation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install VL-64
        run: python -m pip install -e '.[dev]'
      - name: Check regression and translation suites
        run: python -m pytest -q -s tests/
      - name: Check CLI
        run: |
          python -m vld verify
          python -m vld navigate --a 5 --b 1 --x0 3 --steps 1000000000000 --modulus 256
      - name: Translate actual observed byte stream
        run: |
          python - <<'PY'
          import json, time
          from vld import ObservedGround
          g = ObservedGround({"complete": None, "counter": (0,), "changing": (1,)})
          train = [(bytes((i,16*t+i)),bytes(((i+1)%16,80+16*t+i)))
                   for t in range(4) for i in range(16)]
          heldout = [(bytes((i,160+i)),bytes(((i+1)%16,192+i))) for i in range(16)]
          g.fit(train)
          ranking = g.evaluate(heldout)
          t=time.perf_counter()
          result=g.navigate(bytes((3,250)),10**12+5,"counter")
          elapsed=(time.perf_counter()-t)*1000
          print("VL64_GROUND",json.dumps({
            "ranking":ranking,"profile":g.profile("counter"),"navigation":result,
            "navigation_elapsed_ms":elapsed
          },sort_keys=True))
          assert ranking[0]["view"]=="counter"
          assert result["terminal_state"]==f"{(3+10**12+5)%16:02x}"
          PY
