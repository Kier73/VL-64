name: VL-64 host-resident operational model Grounds

on:
  push:
    paths:
      - 'experiments/model_fabric/operational_*.py'
      - 'tests/test_operational_*.py'
      - 'docs/OPERATIONAL_MODEL_GROUNDS.md'
      - '.github/workflows/operational-model-ground.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      execute_pretrained_transformer:
        description: 'Run an optional genuine pinned pretrained SmolLM2 host (downloads weights)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  operational-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Verify host-resident numerics, tiled logits, cross-process recovery and agent authority
        run: python -m pytest -q tests/test_operational_ground.py tests/test_operational_tensor_graph.py tests/test_operational_model_lab.py
      - name: Benchmark real trained byte-language model through the Virtual Layer
        run: >-
          python -m experiments.model_fabric.operational_model_lab
          --backend byte --prompt 'Virtual Layer' --steps 12
          --out artifacts/operational-byte-language.json
      - name: Enforce unchanged compact Virtual Layer code budget
        run: |
          python - <<'PY'
          from pathlib import Path
          total=sum(p.stat().st_size for p in Path('src/vld').glob('*.py'))
          assert total<=65536
          print('VL64_CORE_BYTES',total)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vl64-operational-byte-language-${{ matrix.python-version }}
          path: artifacts/operational-byte-language.json
          if-no-files-found: warn

  optional-pretrained-transformer:
    if: (github.event_name == 'workflow_dispatch' && inputs.execute_pretrained_transformer) || (github.event_name == 'pull_request' && github.head_ref == 'feat/operational-model-grounds-20261119')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model-host backend
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' 'transformers>=4.50,<5'
      - name: Real pinned SmolLM2 model-host next-token test, or explicit unresolved receipt
        run: >-
          python -m experiments.model_fabric.operational_model_lab
          --backend transformer --prompt 'The capital of France is' --steps 3
          --out artifacts/operational-smollm2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vl64-pinned-transformer-operational-test
          path: artifacts/operational-smollm2.json
          retention-days: 30
          if-no-files-found: warn
