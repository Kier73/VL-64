name: Qualified retained pretrained ranges and independent references

on:
  push:
    branches: [main]
    paths:
      - 'experiments/model_fabric/qualified_range_cache.py'
      - 'experiments/model_fabric/retained_model_lab.py'
      - 'experiments/model_fabric/scaled_model_fabric.py'
      - 'tests/test_qualified_range_cache.py'
      - 'tests/test_retained_model_lab.py'
      - 'tests/test_saved_real_range_retention.py'
      - 'experiments/model_fabric/datasets/2026-11-19-real-retained-pretrained-range-observations.json'
      - '.github/workflows/retained-model-ranges.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Retained Qwen causal state, DeepSeek selected experts, crash recovery, and source requalification
        run: |
          python -m pytest -q tests/test_qualified_range_cache.py tests/test_retained_model_lab.py tests/test_saved_real_range_retention.py \
            tests/test_complete_native_layers.py tests/test_trained_subgraphs.py \
            tests/test_qualified_subgraphs.py tests/test_scaled_model_fabric.py
      - name: Preserve 64 KiB compact kernel ceiling
        run: |
          python - <<'PY'
          from pathlib import Path
          size=sum(p.stat().st_size for p in Path('src/vld').glob('*.py'))
          print('VL64_CORE_BYTES',size)
          assert size<=65536
          PY

  pinned-subgraphs:
    # Network result is independent of mandatory fixture verification.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        model: ['qwen','deepseek']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Actual pinned model bytes reused with independent scalar reference
        run: |
          python -m experiments.model_fabric.retained_model_lab \
            --model '${{ matrix.model }}' \
            --cache-dir 'artifacts/${{ matrix.model }}-qualified-ranges' \
            --out 'artifacts/${{ matrix.model }}-retention.json'
      - name: Retain success or explicit UNRESOLVED report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vl64-retained-${{ matrix.model }}-observations
          path: artifacts/${{ matrix.model }}-retention.json
          retention-days: 30
          if-no-files-found: warn
