name: VL-64 source-pinned resident behavioral observers

on:
  push:
    paths:
      - "experiments/model_fabric/source_pinned_behavior_fleet.py"
      - "experiments/model_fabric/source_pinned_behavior_fleet_lab.py"
      - "tests/test_source_pinned_behavior_fleet.py"
      - "docs/SOURCE_PINNED_BEHAVIOR_FLEET.md"
      - ".github/workflows/source-pinned-behavior-fleet.yml"
  pull_request:
    paths:
      - "experiments/model_fabric/source_pinned_behavior_fleet.py"
      - "experiments/model_fabric/source_pinned_behavior_fleet_lab.py"
      - "tests/test_source_pinned_behavior_fleet.py"
      - "docs/SOURCE_PINNED_BEHAVIOR_FLEET.md"
      - ".github/workflows/source-pinned-behavior-fleet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-behavior:
    name: Behavioral Ground and causal host execution (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install VL64 experiments
        run: python -m pip install -e ".[dev]"
      - name: Verify original host numerical operators and new source observer bridge
        run: python -m pytest -q tests/test_source_pinned_behavior_fleet.py tests/test_operational_ground.py tests/test_intention_fabric.py tests/test_virtual_page_fleet.py
      - name: Benchmark concurrent trained host conversations
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m experiments.model_fabric.source_pinned_behavior_fleet_lab --observers 16 --workers 8 --tokens 3 --out artifacts/mpf002-trained-host-fleet.json
      - name: Retain benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: mpf002-host-resident-behavior-16-observers
          path: artifacts/mpf002-trained-host-fleet.json
          if-no-files-found: error
