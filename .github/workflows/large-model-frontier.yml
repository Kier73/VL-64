name: VL-64 scale-independent model Grounds

on:
  push:
    branches:
      - main
      - feat/scaled-model-sharded-grounds-20261119
    paths:
      - "experiments/model_fabric/scaled_model_fabric.py"
      - "experiments/model_fabric/scaled_model_lab.py"
      - "tests/test_scaled_model_fabric.py"
      - "tests/test_scaled_model_lab.py"
      - "docs/SCALE_INDEPENDENT_MODEL_GROUNDS.md"
      - ".github/workflows/large-model-frontier.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Validate model-scale-neutral index, header, network and numeric contracts
        run: python -m pytest -q tests/test_scaled_model_fabric.py tests/test_scaled_model_lab.py
      - name: Retain sub-64 KiB original VL-64 source
        run: |
          python - <<'PY'
          from pathlib import Path
          size = sum(p.stat().st_size for p in Path("src/vld").glob("*.py"))
          assert size <= 65536, size
          print("VL64_CORE_BYTES", size)
          PY

  pinned-large-model-structural-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true  # Network may reject requests; unresolved is not verification.
    strategy:
      fail-fast: false
      matrix:
        model: [qwen, deepseek]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Read only pinned config, index, and small BF16/F32 norm weight range
        run: |
          python -m experiments.model_fabric.scaled_model_lab \
            --model "${{ matrix.model }}" --numeric \
            --out "artifacts/${{ matrix.model }}-scale-ground.json"
      - name: Retain exact evidence or explicit unresolved status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vl64-${{ matrix.model }}-scale-evidence
          path: artifacts/${{ matrix.model }}-scale-ground.json
          retention-days: 30
          if-no-files-found: warn
