name: Full-scale VL64 B1 recovery benchmark

on:
  push:
    paths:
      - 'experiments/model_fabric/remote_large_recovery_benchmark.py'
      - 'experiments/model_fabric/remote_large_fleet.py'
      - 'tests/test_remote_large_recovery_benchmark.py'
      - 'docs/B1_FULL_SCALE_RECOVERY_BENCHMARK.md'
      - '.github/workflows/b1-full-scale-recovery.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run credentialed full-scale Qwen and DeepSeek B1 benchmark (provider charges may apply)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  independent-control-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Independent protocol, code-law and cross-process recovery tests
        run: python -m pytest -q tests/test_remote_large_fleet.py tests/test_remote_large_recovery_benchmark.py
      - name: Enforce compact VL64 executable source constraint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          n=sum(p.stat().st_size for p in Path('src/vld').glob('*.py'))
          assert n<=65536
          print('VL64_CORE_BYTES',n)
          PY
      - name: Run four genuine interpreter processes, WITHOUT pretrained model execution
        run: python -m experiments.model_fabric.remote_large_recovery_benchmark --fixture --working-dir artifacts/b1-fixture-work --out artifacts/b1-fixture.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-cpu-fixture-${{ matrix.python-version }}
          path: artifacts/b1-fixture.json
          if-no-files-found: warn

  opt-in-provider-models:
    # A single controlled evaluation on the initial feature PR; once merged,
    # no subsequent PR/push should unexpectedly spend provider credits.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_live == true) ||
      (github.event_name == 'pull_request' && github.head_ref == 'feat/vl64-b1-benchmark-cross-process-20261119')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Determine qualified provider availability without revealing secrets
        id: availability
        shell: bash
        run: |
          if [[ -n "$HF_TOKEN" && -n "$DEEPSEEK_API_KEY" ]]; then
            echo 'qualified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'qualified=false' >> "$GITHUB_OUTPUT"
            mkdir -p artifacts
            echo '{"status":"UNRESOLVED_MISSING_PROVIDER_CREDENTIALS","no_real_inference_claim":true,"execution_grade":"B1_provider_chat"}' > artifacts/b1-live.json
          fi
      - name: Actual pretrained provider-hosted full-scale task benchmark
        if: steps.availability.outputs.qualified == 'true'
        run: python -m experiments.model_fabric.remote_large_recovery_benchmark --live --max-tokens 128 --working-dir artifacts/b1-live-work --out artifacts/b1-live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-full-scale-provider-evidence
          path: artifacts/b1-live.json
          if-no-files-found: warn
