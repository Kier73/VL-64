name: Intention model Grounds, fleet and 64KiB core integrity

on:
  push:
    paths:
      - 'src/vld/micro_kernel.py'
      - 'src/vld/micro_substrates.py'
      - 'experiments/model_fabric/intention_*.py'
      - 'experiments/model_fabric/native_chat_host.py'
      - 'experiments/model_fabric/operational_ground.py'
      - 'experiments/model_fabric/operational_hosts.py'
      - 'tests/test_intention_*.py'
      - 'tests/test_core_integrity_bounds.py'
      - 'tests/test_host_resident_kv.py'
      - '.github/workflows/intention-model-fleet.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      pretrained_instruction_model:
        type: boolean
        default: false
        description: 'Opt in to downloading a pinned real instruction model'
      model:
        type: string
        required: false
        description: 'HF model name, if opted in'
      revision:
        type: string
        required: false
        description: 'Exact 40-character HF commit SHA'

permissions:
  contents: read

jobs:
  independent-model-and-core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Run intent, tokenizer, agent, fleet, and core audit regressions
        run: python -m pytest -q tests/test_intention_fabric.py tests/test_intention_trained_byte.py tests/test_intention_fleet_lab.py tests/test_core_integrity_bounds.py tests/test_host_resident_kv.py tests/test_operational_ground.py tests/test_operational_tensor_graph.py
      - name: Enforce compact source budget
        run: |
          python - <<'PY'
          from pathlib import Path
          n=sum(p.stat().st_size for p in Path('src/vld').glob('*.py'))
          assert n<=65536, f'Core exceeded 64KiB: {n}'
          print('VL64_CORE_BYTES',n)
          PY
      - name: Execute two distinct trained model hosts through the VL
        run: python -m experiments.model_fabric.intention_fleet_lab --steps 8 --out artifacts/intent-fleet.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-fleet-${{ matrix.python-version }}
          path: artifacts/intent-fleet.json
          if-no-files-found: warn

  optional-real-instruction-model:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/intent-model-fleet-core-audit-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]' torch transformers
      - name: Attempt actual paragraph, Python and authorized-action intentions
        env:
          MODEL: HuggingFaceTB/SmolLM2-135M-Instruct
          REVISION: 12fd25f77366fa6b3b4b768ec3050bf629380bac
        shell: bash
        run: |
          set +e
          python -m experiments.model_fabric.intention_fleet_lab --backend instruction \
            --model "$MODEL" --revision "$REVISION" --kind paragraph --steps 32 \
            --task "Write a coherent paragraph about virtual grounds." \
            --out artifacts/real-paragraph.json
          python -m experiments.model_fabric.intention_fleet_lab --backend instruction \
            --model "$MODEL" --revision "$REVISION" --kind python --steps 48 \
            --task "Write a Python function add(a,b) returning a+b. Respond with source code only." \
            --out artifacts/real-python.json
          python -m experiments.model_fabric.intention_fleet_lab --backend instruction \
            --model "$MODEL" --revision "$REVISION" --kind tool_json --steps 48 \
            --task "Request the approved add_numbers tool with a=3, b=4, then return the sum." \
            --out artifacts/real-agent.json
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-instruction-intent-observations
          path: artifacts/real-*.json
          if-no-files-found: warn
