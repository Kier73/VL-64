name: VL-64 incremental pretrained decoder KV continuity

on:
  push:
    branches: [main]
    paths:
      - "experiments/model_fabric/incremental_decoder.py"
      - "tests/test_incremental_decoder.py"
      - "docs/INCREMENTAL_PRETRAINED_DECODER.md"
      - ".github/workflows/incremental-pretrained-decoder.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incremental-numerics:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]' numpy
      - name: Independently verify 30-layer autoregressive KV reuse
        run: |
          python -m pytest -q tests/test_full_decoder.py tests/test_incremental_decoder.py
      - name: Preserve VL64 portable core budget
        run: |
          python - <<'PY'
          from pathlib import Path
          n=sum(p.stat().st_size for p in Path('src/vld').glob('*.py'))
          assert n<=65536
          print('VL64_CORE_SOURCE_BYTES',n)
          PY
