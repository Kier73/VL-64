name: VL64 pretrained causal orbit recovery and observer rehome

on:
  push:
    branches:
      - main
      - feat/recoverable-model-orbit-20261118
    paths:
      - "experiments/model_fabric/**"
      - "tests/test_pretrained_orbit.py"
      - "tests/test_pretrained_chain.py"
      - "tests/test_pretrained_layer.py"
      - "tests/test_execution_dag.py"
      - ".github/workflows/pretrained-orbit.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-reference-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install model fabric test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate typed DAG, two-layer math and cross-process checkpoint rehome
        run: |
          python -m pytest -q tests/test_execution_dag.py \
            tests/test_pretrained_layer.py tests/test_pretrained_chain.py \
            tests/test_pretrained_orbit.py tests/test_saved_real_pretrained_chain.py
      - name: Preserve compact core under 64 KiB
        run: |
          python - <<'PY'
          from pathlib import Path
          count=sum(p.stat().st_size for p in Path("src/vld").glob("*.py"))
          assert count <= 65536, count
          print("VL64_COMPACT_CORE_BYTES",count)
          PY

  pinned-bf16-recovered-orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Public model range availability is external and must not gate deterministic fixtures.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install model fabric
        run: python -m pip install -e ".[dev]"
      - name: Verify genuine pinned BF16 layer0->layer1 after checkpoint/rehome
        run: |
          python -m experiments.model_fabric.real_orbit_lab \
            --out artifacts/pretrained-orbit-report.json \
            --state-dir artifacts/pretrained-orbit-pages
      - name: Preserve model pages, checkpoint and verified or unresolved report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vl64-pretrained-orbit-evidence
          path: |
            artifacts/pretrained-orbit-report.json
            artifacts/pretrained-orbit-pages/
          retention-days: 30
          if-no-files-found: warn
