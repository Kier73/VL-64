name: VL-64 trace-derived action Ground synthesis

on:
  push:
    branches:
      - main
      - feature/trace-derived-action-grounds-20261118
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install repository tests
        run: python -m pip install -e ".[dev]"
      - name: Run all tests, including trace synthesizer
        run: python -m pytest -q tests/
      - name: Verify compact-core source byte budget
        run: |
          python - <<'PY'
          from pathlib import Path
          n=sum(p.stat().st_size for p in Path("src/vld").glob("*.py"))
          assert n<=65536,n
          print("VL64_TRACE_CORE_BYTES",n)
          PY
