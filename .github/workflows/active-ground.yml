name: VL-64 active action-conditioned Ground research

on:
  push:
    branches:
      - main
      - feature/active-action-ground-probes-20261118
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-ground:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ["3.11","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install environment
        run: python -m pip install -e ".[dev]"
      - name: Run existing and active-learning regressions
        run: python -m pytest -q tests/
      - name: Discover and distinguish competing Grounds with authorized reset probes
        run: |
          python -m experiments.byte_fabric.active_lab --out artifacts
          python -m experiments.observer_intent.arbitrate \
            --intent artifacts/active-next-probe-intent.json \
            --out artifacts/observer-recommended-probe.json
          python -m experiments.observer_intent.arbitrate \
            --intent artifacts/active-action-navigation-intent.json \
            --out artifacts/observer-action-navigation.json
      - name: Verify distinct actions, eliminated candidates, powered navigation and 64 KiB
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts")
          read=lambda n:json.loads((p/n).read_text())
          report=read("active-results.json")
          session=read("active-session.json")
          suggested=read("observer-recommended-probe.json")
          distant=read("observer-action-navigation.json")
          assert report["candidate_count_initial"]==4
          assert report["candidate_count_final"]==1
          assert report["resettable_probe_rounds"]==2
          assert report["action_words"][0]!=report["action_words"][1]
          assert report["information_gain_per_round_bits"]==[1.0,1.0]
          assert report["total_observed_action_outputs"]==4
          assert len(session["observations"])==2
          assert session["status"]=="ONE_HYPOTHESIS_REMAINS"
          assert suggested["status"]=="QUALIFIED_INFORMATIVE_PROBE"
          assert distant["status"]=="MODELED_ACTION_NAVIGATION"
          assert distant["result"]["steps"]==10**12
          assert distant["result"]["terminal_state"]==1
          assert distant["plan"]["execution_authority"]=="no_host_actions_performed_by_this_observer_route"
          core=sum(f.stat().st_size for f in Path("src/vld").glob("*.py"))
          assert core<=65536
          print("VL64_ACTIVE_VERIFIED",json.dumps({
            "initial_candidates":report["candidate_count_initial"],
            "rounds":report["resettable_probe_rounds"],
            "selected":report["selected_ground_digest"],
            "query_words":report["action_words"],
            "horizon":report["modeled_repeated_action_horizon"],
            "power_compositions":report["power_compositions"],
            "core_bytes":core,
          },sort_keys=True))
          PY
      - name: Compare host hypotheses with real read-only GitHub byte observations
        continue-on-error: true
        run: |
          python -m experiments.byte_fabric.active_lab \
            --out artifacts --live-only
      - name: Preserve candidate Grounds, planned actions, observations and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-ground-python-${{ matrix.python-version }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: warn
